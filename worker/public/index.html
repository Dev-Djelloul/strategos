<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategos — Globe des conflits</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>🌍 Strategos</h1>
      <p class="subtitle">Globe des conflits et tensions géopolitiques</p>
    </div>
    <div class="topbar-actions">
      <a class="btn-secondary link-btn" href="/methodologie" title="Sources, fiabilité, limites">Sources et méthodologie</a>
      <button id="toolbar-toggle" class="btn-icon" title="Replier/déplier la barre d'outils" aria-expanded="true">▲</button>
    </div>
  </header>

  <div class="source-banner" id="source-banner" hidden></div>

  <div class="toolbar" id="toolbar">
    <div class="toolbar-group">
      <span class="toolbar-group-label">Filtres conflits</span>
      <div class="toolbar-row">
        <div class="field">
          <label for="days">Période</label>
          <select id="days">
            <option value="1">Dernières 24h</option>
            <option value="7">7 derniers jours</option>
            <option value="30">30 derniers jours</option>
          </select>
        </div>
        <div class="field">
          <label for="country">Pays</label>
          <select id="country">
            <option value="">Tous</option>
          </select>
        </div>
        <div class="field">
          <label for="event-type">Type</label>
          <select id="event-type">
            <option value="all">Tous</option>
          </select>
        </div>
        <button id="refresh" class="btn-primary">↻ Actualiser</button>
      </div>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-group-label">Sources de conflits</span>
      <div class="toolbar-row">
        <label class="toggle" title="Données qualifiées (accès API sur validation)"><input type="checkbox" id="acled-toggle" checked /> ACLED <span class="layer-badge" id="acled-badge"></span></label>
        <label class="toggle" title="Uppsala Conflict Data Program - référence académique (jeton requis)"><input type="checkbox" id="ucdp-toggle" checked /> UCDP <span class="layer-badge" id="ucdp-badge"></span></label>
        <label class="toggle" title="Détection automatique dans la presse mondiale - non vérifié"><input type="checkbox" id="gdelt-toggle" checked /> GDELT (presse) <span class="layer-badge" id="gdelt-badge"></span></label>
        <label class="toggle" title="Décoché : n'affiche que les événements appuyés par une source qualifiée"><input type="checkbox" id="press-toggle" checked /> Événements presse seule</label>
      </div>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-group-label">Couches</span>
      <div class="toolbar-row">
        <label class="toggle" title="Contrôle territorial des localités en Ukraine (VIINA, mise à jour quotidienne) — estimation agrégée"><input type="checkbox" id="control-toggle" /> 🟥 Contrôle (Ukraine) <span class="layer-badge" id="control-badge"></span></label>
        <label class="toggle"><input type="checkbox" id="nuclear-toggle" checked /> ☢️ Sites nucléaires <span class="layer-badge" id="nuclear-badge"></span></label>
        <label class="toggle"><input type="checkbox" id="military-toggle" /> 🎖️ Bases militaires <span class="layer-badge" id="military-badge"></span></label>
        <label class="toggle"><input type="checkbox" id="infrastructure-toggle" /> 🛫 Infrastructures <span class="layer-badge" id="infrastructure-badge"></span></label>
      </div>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-group-label">Navigation 3D</span>
      <div class="toolbar-row">
        <div class="field">
          <label for="region">Aller à</label>
          <select id="region"><option value="">Choisir une région…</option></select>
        </div>
        <div class="field zone-field">
          <label>Cadre de zone</label>
          <div class="zone-buttons">
            <button id="zone-view" class="btn-secondary" title="Limite toutes les couches à la zone actuellement visible">⬚ Cadrer la vue</button>
            <button id="zone-clear" class="btn-secondary" title="Retire le cadre">Toute la planète</button>
          </div>
        </div>
        <label class="toggle" title="Villes et reliefs en 3D photoréaliste (Google Photorealistic 3D Tiles via Cesium Ion), à zoom rapproché"><input type="checkbox" id="photo3d-toggle" /> Villes 3D photoréalistes</label>
      </div>
    </div>

    <div class="toolbar-group">
      <span class="toolbar-group-label">Heure</span>
      <div class="toolbar-row world-clock-row">
        <div class="world-clock-utc">
          <span id="clock-utc-time">--:--:--</span>
          <span class="world-clock-utc-label">UTC</span>
        </div>
        <div class="world-clock-cities" id="clock-cities"></div>
      </div>
    </div>

    <div class="toolbar-status">
      <span id="zone-label" class="status">Zone : toute la planète</span>
      <span id="status" class="status"></span>
    </div>
  </div>

  <div id="cesiumContainer">
    <div class="timeline" id="timeline" hidden>
      <button id="timeline-play" class="btn-icon" title="Lecture / pause">▶</button>
      <input type="range" id="timeline-slider" min="0" max="0" value="0" />
      <span id="timeline-label" class="timeline-label"></span>
    </div>
  </div>

  <aside id="side-panel" class="side-panel" aria-live="polite">
    <button id="side-panel-close" class="btn-icon side-panel-close" title="Fermer">✕</button>
    <div id="side-panel-body"></div>
  </aside>

  <script src="/config.js"></script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
