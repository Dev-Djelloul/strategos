<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategos — Carte des conflits</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Strategos</h1>
    <p class="subtitle">Carte des conflits et tensions — données GDELT, actualité 24h</p>
  </header>

  <div class="controls">
    <label for="timespan">Période :</label>
    <select id="timespan">
      <option value="24h">Dernières 24h</option>
      <option value="7d">7 derniers jours</option>
      <option value="1w">1 semaine</option>
    </select>
    <button id="refresh">Actualiser</button>
    <label class="demo-label"><input type="checkbox" id="demo-toggle" /> Mode démo (sans réseau)</label>
    <span id="status" class="status"></span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
