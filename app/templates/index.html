<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strategos — Globe des conflits</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Strategos</h1>
    <p class="subtitle">Globe des conflits et tensions — données ACLED</p>
  </header>

  <div class="controls">
    <label for="days">Période :</label>
    <select id="days">
      <option value="1">Dernières 24h</option>
      <option value="7">7 derniers jours</option>
      <option value="30">30 derniers jours</option>
    </select>

    <label for="country">Pays :</label>
    <select id="country">
      <option value="">Tous</option>
    </select>

    <label for="event-type">Type :</label>
    <select id="event-type">
      <option value="all">Tous</option>
    </select>

    <button id="refresh">Actualiser</button>
    <label class="demo-label"><input type="checkbox" id="demo-toggle" /> Mode démo (sans réseau)</label>
    <span id="status" class="status"></span>
  </div>

  <div id="cesiumContainer"></div>

  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
