name: Déploiement du Worker

# Déploie le Worker Cloudflare (code + assets statiques) à chaque push sur
# master qui touche worker/, sans attendre le cron de mise à jour VIINA.
on:
  push:
    branches: [master]
    paths:
      - "worker/**"
  workflow_dispatch: {} # déclenchement manuel depuis l'onglet Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installe les dépendances du Worker
        working-directory: worker
        run: npm ci

      - name: Vérifie les types
        working-directory: worker
        run: npm run typecheck

      - name: Déploie sur Cloudflare
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
